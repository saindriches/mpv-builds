name: build

# Builds mpv (the player: mpv.app on macOS, mpv.exe on Windows, the binary on Linux) against an
# FFmpeg compiled from our fork (saindriches/FFmpeg @ bt1869-tlv-ci, pinned by commit), so mpv plays
# ISDB-S3 4K/8K .mmts natively through the bt1869_tlv demuxer. The branch is the bt1869-tlv upstream
# series on the fork base (413346bd, master of 2025-12-02) plus the AVS+ decoder commits. mpv's own
# source tweaks live in patches/mpv/ and apply in order.
#
# Caching, so iterating is cheap:
#   1. The built FFmpeg prefix is cached, keyed on the pinned fork commit (FFMPEG_REF). It only
#      rebuilds when that ref changes; mpv-only iterations restore it in seconds.
#   2. ccache accelerates recompiles (mpv, and FFmpeg when it does rebuild), keyed per platform
#      with a rolling restore-key (mpv's own CI pattern).
#
# macOS ships an Apple Silicon (arm64) mpv.app built on macos-26. The universal build is gone:
# Homebrew no longer installs on Intel Macs ("only supported on Apple Silicon processors"), so the
# x86_64 half had no dependencies, and macos-14 lost its Homebrew bottles (2026-10).

on:
  push:
    branches: [main]
    paths: ['patches/**', 'scripts/**', '.github/workflows/build.yml', 'manifest.env']
  workflow_dispatch:
    inputs:
      mpv_ref:
        description: "mpv git ref to build (default: master / nightly)"
        default: "master"
      force_rebuild_ffmpeg:
        description: "Ignore the FFmpeg prefix cache and rebuild it"
        type: boolean
        default: false
  schedule:
    - cron: '0 18 * * *'   # nightly (mpv master moves; FFmpeg stays cached unless patches change)

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FFMPEG_REPO: "saindriches/FFmpeg"
  FFMPEG_REF: "1216d32d9bc7e32675ab6d141899b07891f38bf6"
  MPV_REF: ${{ github.event.inputs.mpv_ref || 'master' }}
  CACHE_EPOCH: "1"

jobs:
  # ---------------------------------------------------------------- macOS (arm64) ---------------
  macos:
    runs-on: macos-26
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: "800M"
    steps:
      # FFmpeg must build OUTSIDE the workspace: its path contains "mpv" (repo mpv-builds), which
      # trips dylib_unhell's self-reference guard so macos-bundle won't relocate our libav*. The
      # runner context is unavailable in job-level env, so set PREFIX here via $RUNNER_TEMP.
      - name: Set build environment
        run: echo "PREFIX=$RUNNER_TEMP/ffprefix" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Checkout mpv
        uses: actions/checkout@v4
        with:
          repository: mpv-player/mpv
          ref: ${{ env.MPV_REF }}
          path: mpv

      - name: Apply mpv source patches
        run: |
          shopt -s nullglob
          for p in "$GITHUB_WORKSPACE"/patches/mpv/*.patch; do
            echo "mpv-builds: applying $(basename "$p")"; patch -p1 -F3 -d mpv -i "$p"
          done

      - name: Restore FFmpeg prefix
        id: ffcache
        if: ${{ github.event.inputs.force_rebuild_ffmpeg != 'true' }}
        uses: actions/cache@v4
        with:
          path: ${{ env.PREFIX }}
          key: ffmpeg-macos-arm64-${{ env.FFMPEG_REF }}-epoch${{ env.CACHE_EPOCH }}

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-macos-arm64-${{ github.run_id }}
          restore-keys: ccache-macos-arm64-

      - name: Install toolchain + mpv deps (not FFmpeg; we build that patched)
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euxo pipefail
          brew update
          # --overwrite so a formula that still collides on link takes the path rather than failing.
          brew install --overwrite ccache nasm meson ninja pkg-config \
            luajit libass libplacebo little-cms2 uchardet mujs \
            libarchive libbluray rubberband zimg libcaca libcdio-paranoia libdvdnav \
            molten-vk vulkan-loader vulkan-headers rust

      - name: Build patched FFmpeg
        if: ${{ steps.ffcache.outputs.cache-hit != 'true' }}
        env:
          CC: "ccache clang"
          CXX: "ccache clang++"
        run: ./scripts/build-ffmpeg.sh

      - name: Build mpv + app bundle
        env:
          CC: "ccache clang"
          CXX: "ccache clang++"
        run: |
          set -euxo pipefail
          BREW_PREFIX="$(brew --prefix)"
          # our patched FFmpeg first, then Homebrew for the rest of the deps
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$BREW_PREFIX/lib/pkgconfig:$(brew --prefix libarchive)/lib/pkgconfig"
          cd mpv
          meson setup build \
            -Dprefix="$GITHUB_WORKSPACE/mpv-out" \
            -Dlibmpv=true \
            -D{cocoa,coreaudio,gl-cocoa,videotoolbox-gl,videotoolbox-pl}=enabled \
            -D{swift-build,macos-cocoa-cb,macos-media-player,macos-touchbar}=enabled \
            -D{gl,plain-gl,iconv,lcms2,lua,libarchive,libbluray,rubberband,zimg,zlib,vulkan}=enabled \
            -Dobjc_args="-Wno-error=deprecated -Wno-error=deprecated-declarations"
          meson compile -C build
          meson compile -C build macos-bundle       # -> build/mpv.app
          test -d build/mpv.app || { echo "::error::mpv.app not produced"; exit 1; }

      - name: Verify bundle (relocated libav*, launches)
        run: |
          set -euxo pipefail
          APP="$GITHUB_WORKSPACE/mpv/build/mpv.app"; BIN="$APP/Contents/MacOS/mpv"
          # With the FFmpeg prefix outside the workspace, macos-bundle (dylib_unhell) relocates our
          # libav* into Contents/MacOS/lib and rewrites the load paths. Fail loudly if any leak.
          if otool -L "$BIN" | grep -q 'ffprefix/lib/'; then
            echo "::error::mpv still references the build prefix"; otool -L "$BIN"; exit 1; fi
          test -f "$APP/Contents/MacOS/lib/libavcodec.62.dylib" || { echo "::error::libavcodec not relocated into the bundle"; exit 1; }
          strings "$APP"/Contents/MacOS/lib/libavformat.*.dylib | grep -x bt1869_tlv >/dev/null \
            || { echo "::error::bundled libavformat lacks the bt1869_tlv demuxer"; exit 1; }
          lipo -archs "$BIN"
          codesign --verify --deep --strict "$APP" || codesign --force --deep --sign - "$APP"
          "$BIN" --version

      - name: Package
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/mpv/build"
          tar cJf "$RUNNER_TEMP/mpv-macos-arm64.tar.xz" mpv.app
          shasum -a 256 "$RUNNER_TEMP/mpv-macos-arm64.tar.xz"

      - uses: actions/upload-artifact@v4
        with:
          name: mpv-macos-arm64
          path: ${{ runner.temp }}/mpv-macos-arm64.tar.xz
          if-no-files-found: error

  # ---------------------------------------------------------------- Linux (x86_64) ---------------
  linux:
    runs-on: ubuntu-latest
    env:
      PREFIX: ${{ github.workspace }}/ffprefix
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: mpv-player/mpv, ref: "${{ env.MPV_REF }}", path: mpv }

      - name: Apply mpv source patches
        run: |
          shopt -s nullglob
          for p in "$GITHUB_WORKSPACE"/patches/mpv/*.patch; do patch -p1 -F3 -d mpv -i "$p"; done

      - name: Restore FFmpeg prefix
        id: ffcache
        if: ${{ github.event.inputs.force_rebuild_ffmpeg != 'true' }}
        uses: actions/cache@v4
        with:
          path: ${{ env.PREFIX }}
          key: ffmpeg-linux-x86_64-lp-${{ env.FFMPEG_REF }}-epoch${{ env.CACHE_EPOCH }}

      - uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-${{ github.run_id }}
          restore-keys: ccache-linux-

      - name: Install deps (not FFmpeg; built patched)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache nasm meson ninja-build pkg-config build-essential git \
            libass-dev liblcms2-dev libluajit-5.1-dev libx11-dev \
            libwayland-dev libdrm-dev libegl1-mesa-dev libgl1-mesa-dev libpulse-dev \
            libarchive-dev libbluray-dev librubberband-dev libzimg-dev \
            glslang-tools libshaderc-dev libvulkan-dev python3-jinja2

      - name: Build patched FFmpeg + libplacebo
        if: ${{ steps.ffcache.outputs.cache-hit != 'true' }}
        env: { CC: "ccache gcc", CXX: "ccache g++" }
        run: |
          set -euxo pipefail
          ./scripts/build-ffmpeg.sh
          # Ubuntu's libplacebo (6.x) is older than mpv master needs (>=7.360.1) and mpv ships no
          # wrap for it, so build it from source into the same prefix. Minimal: no demos/tests.
          git clone --depth 1 --recurse-submodules https://github.com/haasn/libplacebo.git /tmp/libplacebo
          meson setup /tmp/libplacebo/build /tmp/libplacebo \
            --prefix="$PREFIX" --libdir=lib --buildtype=release -Ddemos=false -Dtests=false
          meson compile -C /tmp/libplacebo/build
          meson install -C /tmp/libplacebo/build

      - name: Build mpv
        # ffmpeg installs .pc under lib/pkgconfig; a cached libplacebo may sit in the multiarch dir.
        env: { CC: "ccache gcc", CXX: "ccache g++", PKG_CONFIG_PATH: "${{ github.workspace }}/ffprefix/lib/pkgconfig:${{ github.workspace }}/ffprefix/lib/x86_64-linux-gnu/pkgconfig" }
        run: |
          set -euxo pipefail
          cd mpv
          meson setup build -Dprefix="$GITHUB_WORKSPACE/mpv-out" -Dlibmpv=true
          meson compile -C build
          meson install -C build

      - name: Package
        run: |
          cd "$GITHUB_WORKSPACE"
          tar cJf "$RUNNER_TEMP/mpv-linux-x86_64.tar.xz" -C ffprefix lib -C "$GITHUB_WORKSPACE/mpv-out" bin
          shasum -a 256 "$RUNNER_TEMP/mpv-linux-x86_64.tar.xz" || true
      - uses: actions/upload-artifact@v4
        with: { name: mpv-linux-x86_64, path: "${{ runner.temp }}/mpv-linux-x86_64.tar.xz", if-no-files-found: error }

  # ---------------------------------------------------------------- Windows (x86_64, MSYS2) ------
  # Builds a real mpv.exe on a windows-latest runner via MSYS2 (UCRT64; MSYS2 dropped packages
  # such as rubberband and luajit from MINGW64 in 2026, which broke the old job). We build our patched
  # FFmpeg from source into a prefix, then build mpv against it with the mingw-w64 deps, and package
  # mpv.exe plus its runtime DLLs. The FFmpeg prefix is cached like the other platforms.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout mpv-builds
        uses: actions/checkout@v4

      - name: Checkout mpv
        uses: actions/checkout@v4
        with: { repository: mpv-player/mpv, ref: "${{ env.MPV_REF }}", path: mpv }

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel git zip
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-tools
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-libass
            mingw-w64-ucrt-x86_64-libplacebo
            mingw-w64-ucrt-x86_64-luajit
            mingw-w64-ucrt-x86_64-lcms2
            mingw-w64-ucrt-x86_64-uchardet
            mingw-w64-ucrt-x86_64-libarchive
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-rubberband
            mingw-w64-ucrt-x86_64-zimg
            mingw-w64-ucrt-x86_64-shaderc
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-spirv-cross

      - name: Set FFmpeg prefix (MSYS2 path)
        run: echo "PREFIX=$(cygpath -u "$RUNNER_TEMP")/ffprefix" >> "$GITHUB_ENV"

      - name: Restore FFmpeg prefix
        id: ffcache
        if: ${{ github.event.inputs.force_rebuild_ffmpeg != 'true' }}
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffprefix
          key: ffmpeg-windows-x86_64-msys2-${{ env.FFMPEG_REF }}-epoch${{ env.CACHE_EPOCH }}

      - name: Build FFmpeg from the fork (MSYS2 UCRT64)
        if: ${{ steps.ffcache.outputs.cache-hit != 'true' }}
        run: |
          set -euxo pipefail
          test -f "$PREFIX/lib/pkgconfig/libavformat.pc" && { echo "cache hit"; exit 0; }
          work="$(mktemp -d)"; cd "$work"
          git clone --filter=blob:none --no-checkout "https://github.com/${FFMPEG_REPO}.git" ffmpeg-src
          cd ffmpeg-src
          git checkout --detach "$FFMPEG_REF"
          # Native build under UCRT64 (no cross-prefix needed; the toolchain targets Windows).
          ./configure --prefix="$PREFIX" \
            --enable-gpl --enable-version3 \
            --enable-shared --disable-static \
            --disable-programs --disable-doc \
            --enable-network \
            --enable-demuxer=bt1869_tlv
          make -j"$(nproc)"
          make install

      - name: Verify FFmpeg carries the bt1869_tlv demuxer
        run: |
          set -euxo pipefail
          strings "$PREFIX"/bin/avformat-*.dll | grep -x bt1869_tlv >/dev/null \
            || { echo "::error::FFmpeg DLL lacks the bt1869_tlv demuxer"; exit 1; }

      - name: Build mpv (UCRT64) against our FFmpeg
        run: |
          set -euxo pipefail
          cd mpv
          shopt -s nullglob
          for p in "$GITHUB_WORKSPACE"/patches/mpv/*.patch; do
            echo "mpv-builds: applying $(basename "$p")"; patch -p1 -F3 -i "$p"
          done
          # Our FFmpeg first, then the MSYS2 UCRT64 packages for the rest.
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:/ucrt64/lib/pkgconfig"
          meson setup build \
            -Dprefix="$GITHUB_WORKSPACE/mpv-out" \
            -Dlibmpv=true \
            -D{gl,plain-gl,iconv,lcms2,lua,libarchive,rubberband,zimg,zlib,vulkan}=enabled \
            -Dd3d11=enabled -Dwin32-threads=enabled
          meson compile -C build
          test -f build/mpv.exe || { echo "::error::mpv.exe not produced"; exit 1; }

      - name: Package mpv.exe + runtime DLLs
        run: |
          set -euxo pipefail
          out="$(cygpath -u "$RUNNER_TEMP")/mpv-win"
          mkdir -p "$out"
          cp mpv/build/mpv.exe "$out/"
          # Our patched FFmpeg DLLs.
          cp "$PREFIX"/bin/*.dll "$out/" 2>/dev/null || true
          # Resolve mpv.exe's ucrt64 dependency DLLs and copy them in (transitively).
          copy_deps() {
            local bin="$1"
            ntldd -R "$bin" 2>/dev/null \
              | grep -oiE '/ucrt64/bin/[^ ]+\.dll' | sort -u \
              | while read -r dep; do
                  [ -f "$out/$(basename "$dep")" ] || cp "$dep" "$out/"
                done
          }
          # ntldd (mingw-w64-ucrt-x86_64-tools) walks the DLL tree; if missing, fall back to a broad copy.
          if command -v ntldd >/dev/null 2>&1; then
            copy_deps "$out/mpv.exe"
            for d in "$out"/*.dll; do copy_deps "$d"; done
          else
            echo "::warning::ntldd not found; copying the full ucrt64 DLL set (larger zip)"
            cp /ucrt64/bin/*.dll "$out/" 2>/dev/null || true
          fi
          # Zip with the MSYS2 "zip" package (7z is not on the UCRT64 PATH).
          cd "$(dirname "$out")"
          zip -qr "$(cygpath -u "$RUNNER_TEMP")/mpv-windows-x86_64.zip" "$(basename "$out")"
          ls -l "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: mpv-windows-x86_64
          path: ${{ runner.temp }}/mpv-windows-x86_64.zip
          if-no-files-found: error
